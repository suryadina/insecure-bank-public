worker_processes 4;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    upstream auth-service {
        server auth-service:8080;
        keepalive 32;
    }
    
    upstream transaction-service {
        server transaction-service:8081;
        keepalive 32;
    }
    
    upstream db-admin {
        server db-admin:8082;
    }
    
    upstream customer-service {
        server customer-service:8083;
    }
    
    upstream frontend-react {
        server frontend-react:80;
    }

    upstream game-service {
        server game-service:9090;
    }

    upstream game-frontend {
        server game-frontend:80;
    }

    upstream wordpress-blog {
        server wordpress-blog:80;
    }


    server {
        listen 80;
        
        # Auth service routes
        location /api/auth {
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Internal-only: the no-auth deposit must NOT be reachable from the public
        # surface. The only path to it from outside is the game-service webhook SSRF
        # (which targets the internal docker hostname transaction-service:8081,
        # bypassing nginx entirely).
        location = /api/transactions/deposit {
            return 404;
        }

        # Transaction service routes
        location /api/transactions {
            proxy_pass http://transaction-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Database Admin API routes
        location /TtFkwWSGlzyMrua/api/tables/ {
            proxy_pass http://db-admin/api/tables/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /TtFkwWSGlzyMrua/api/query/ {
            proxy_pass http://db-admin/api/query/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /TtFkwWSGlzyMrua/api/data/ {
            proxy_pass http://db-admin/api/data/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /TtFkwWSGlzyMrua/api/schema/ {
            proxy_pass http://db-admin/api/schema/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Customer service routes (hidden endpoint)
        location /api/cs {
            proxy_pass http://customer-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Database Admin web interface
        location /TtFkwWSGlzyMrua/ {
            proxy_pass http://db-admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Customer Service Frontend (hidden)
        location /cu5st0m3r-z3rv!c3sss {
            proxy_pass http://frontend-react;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        
        # Health check routes
        location /health/auth {
            proxy_pass http://auth-service/actuator/health;
            proxy_set_header Host $host;
        }
        
        location /health/transactions {
            proxy_pass http://transaction-service/health;
            proxy_set_header Host $host;
        }
        
        location /health/TtFkwWSGlzyMrua {
            proxy_pass http://db-admin/;
            proxy_set_header Host $host;
        }
        
        location /health/customer-service {
            proxy_pass http://customer-service/health;
            proxy_set_header Host $host;
        }
        
        # WordPress corporate blog (isolated on wordpress-net)
        location /blog/ {
            proxy_pass http://wordpress-blog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gamification SPA backend API
        location /app/api/ {
            proxy_pass http://game-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gamification SPA frontend
        location /app/ {
            proxy_pass http://game-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /app {
            proxy_pass http://game-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root endpoint - Serve React Frontend
        location / {
            proxy_pass http://frontend-react;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}