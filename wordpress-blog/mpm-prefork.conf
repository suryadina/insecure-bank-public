# Apache prefork pool cap for the lab blog.
#
# WHY: the stock WordPress image allows up to 150 PHP workers, and each worker
# opens one MySQL connection that idles for hours (wait_timeout=28800). When
# students run sqlmap/ffuf/other floods against /blog/, Apache spawns workers
# until they exhaust wordpress-db max_connections=50 and the blog dies with a
# Database Error for EVERYONE (all students share one campus egress IP, so
# per-IP nginx limiting cannot help).
#
# This caps the pool so the blog can never hold more than ~10 MySQL
# connections, no matter how hard it is hammered. Paired with
# --wait-timeout=60 on wordpress-db (see docker-compose.prod.yml) idle
# connections are reaped in a minute instead of 8 hours.
StartServers            20
MinSpareServers         20
MaxSpareServers         50
MaxRequestWorkers       100
MaxConnectionsPerChild  0