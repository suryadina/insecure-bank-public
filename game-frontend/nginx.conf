server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The outer api-gateway nginx proxies /app/... here with the /app/
    # prefix stripped, so this container serves the build output at root
    # even though the browser sees everything under /app/ (React Router's
    # basename handles that, and homepage:"/app" in package.json makes the
    # build reference /app/static/... assets which the outer proxy maps
    # back to /static/... here).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
